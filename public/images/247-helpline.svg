<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Clock Outer Border Ring -->
  <path d="M 250, 25 A 225,225 0 1,1 249.9,25" fill="none" stroke="#4A5568" stroke-width="12" stroke-dasharray="1400" stroke-dashoffset="10" stroke-linecap="round" />
  <path d="M 250, 45 A 205,205 0 1,1 249.9,45" fill="none" stroke="#718096" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Clock Ticks -->
  <line x1="250" y1="55" x2="250" y2="85" stroke="#4A5568" stroke-width="10" stroke-linecap="round" />
  <line x1="365" y1="90" x2="345" y2="115" stroke="#4A5568" stroke-width="8" stroke-linecap="round" />
  <line x1="430" y1="180" x2="400" y2="200" stroke="#4A5568" stroke-width="8" stroke-linecap="round" />
  <line x1="445" y1="285" x2="415" y2="285" stroke="#4A5568" stroke-width="10" stroke-linecap="round" />
  <line x1="55" y1="285" x2="85" y2="285" stroke="#4A5568" stroke-width="10" stroke-linecap="round" />
  <line x1="80" y1="180" x2="110" y2="200" stroke="#4A5568" stroke-width="8" stroke-linecap="round" />
  <line x1="135" y1="90" x2="155" y2="115" stroke="#4A5568" stroke-width="8" stroke-linecap="round" />

  <!-- Clock Hands -->
  <polyline points="250,285 295,130" fill="none" stroke="#4A5568" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="250,285 110,285" fill="none" stroke="#4A5568" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="250" cy="285" r="22" fill="#E63946" />

  <!-- 24/7 Text -->
  <g transform="translate(100, 160)">
    <!-- 24 in Vibrant Red -->
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="115" fill="#E63946" letter-spacing="-2">24</text>
    <!-- Plus symbol icon overlay on 4 -->
    <path d="M 115 50 H 135 V 70 H 155 V 90 H 135 V 110 H 115 V 90 H 95 V 70 H 115 Z" fill="#E63946" opacity="0" />
    <!-- Divider Slash -->
    <text x="135" y="80" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="110" fill="#4A5568">/</text>
    <!-- 7 in Dark Slate Gray -->
    <text x="180" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="115" fill="#4A5568" letter-spacing="-2">7</text>
  </g>

  <!-- EMERGENCY service Subtitle Text -->
  <text x="250" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#E63946" letter-spacing="1">EMERGENCY</text>
  <text x="250" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-style="italic" font-size="32" fill="#4A5568" letter-spacing="0">service</text>
</svg>
